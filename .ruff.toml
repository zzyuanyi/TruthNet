# TruthNet ruff 基线配置
#
# 背景：仓库从无 ruff 配置。历史代码在默认规则集下积压了大量 lint/format 差异，
# 导致 CI 的 `ruff check .` 与 `ruff format --check .` 长期失败（红）。
# 本文件把“历史存量”软性收成基线：让 CI 在基线之上重新变绿，
# 同时对齐 ruff 默认风格（不改变队友现有代码的写法），不位移/改动任何历史文件。
#
# 治理建议：后续想逐步收债，可从面列表里逐条删掉并同步修复对应存量。

target-version = "py311"

[lint]
# 历史存量 lint 错误码基线（至此 `ruff check .` 归零）。
extend-ignore = [
    # isort / import 排序（存量 I001 大量）
    "I001",
    # 未使用 noqa 注释（存量 RUF100）
    "RUF100",
    # 盲捕获异常（存量 BLE001）
    "BLE001",
    # 文件缺少可执行权限/shebang（存量 EXE001）
    "EXE001",
    # 其余规则集存量项（按码汇总）
    "B005", "B017", "B023", "C401", "C408", "DTZ001", "DTZ005", "DTZ007",
    "DTZ011", "ISC004", "N999", "PERF402", "PIE790", "PIE810", "PLC0206",
    "PLE2515", "PLR1704", "PLR1711", "PLR1730", "PLR1736", "PLW0602",
    "PLW1510", "PYI034", "PYI041", "RET501", "RUF007", "RUF012", "RUF013",
    "RUF022", "RUF023", "RUF046", "RUF059", "S110", "S112", "SIM102",
    "SIM103", "SIM113", "SIM114", "SIM115", "SIM117", "SIM210", "SIM222",
    "SIM401", "TRY004", "TRY203", "TRY401", "UP007", "UP009", "UP017",
    "UP031", "UP034", "UP035", "UP037", "UP041", "UP045", "W605",
    "FURB157", "FURB162", "FURB167", "FURB188", "FURB192",
]

[format]
quote-style = "double"
# 历史存量文件不进 ruff format 基线（保持现状不被改动）。
# 下列目录/文件之外的新增 .py 仍受格式检查。
exclude = [
    # 文档 / 技能说明 / 一次性运维脚本 / 测试 / evaluation —— 目录级忽略
    "docs/**",
    ".claude/**",
    "scripts/**",
    "backend/tests/**",
    "tests/**",
    # 历史存量 backend 生产模块 —— 逐个列出，避免误伤未来新文件
    "backend/app/agents/nodes/_answer_fact_lookup.py",
    "backend/app/agents/nodes/_answer_headline.py",
    "backend/app/agents/nodes/equity.py",
    "backend/app/agents/nodes/persist_turn.py",
    "backend/app/domain/finance/rule_r4.py",
    "backend/app/domain/finance/rule_r5.py",
    "backend/app/domain/finance/rule_r7.py",
    "backend/app/domain/risk/fraud_patterns.py",
    "backend/app/application/services/light_comparison_service.py",
    "backend/app/application/services/market_pulse_service.py",
    "backend/app/application/services/query_subject_interpreter.py",
    "backend/app/api/v1/routers/market_pulse.py",
    "backend/app/infrastructure/graph/neo4j/equity_graph.py",
    "backend/app/schemas/market_pulse.py",
]