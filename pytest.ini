[pytest]
# pytest-asyncio：显式声明 async fixture 的 loop 作用域（与未来版本默认一致，
# 避免升级时行为漂移）。值可选 function/class/module/package/session。
asyncio_default_fixture_loop_scope = function

# 统一测试入口：backend/tests（单元/契约/集成）+ tests/evaluation（评测）。
# importlib 模式避免顶层 tests 包与 backend.tests 收集冲突；
# pythonpath=backend 让 app.* 可导入（评测目录也需要）。
addopts = --import-mode=importlib
pythonpath = backend
testpaths =
    backend/tests
    tests/evaluation
